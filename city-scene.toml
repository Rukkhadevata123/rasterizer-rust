[render]
width = 960
height = 540
output = "outputs/city.png"
supersample_scale = 1
exposure = 1.0
ambient_light = [0.12, 0.12, 0.14]
background_gradient_top = [0.16, 0.21, 0.28]
background_gradient_bottom = [0.04, 0.05, 0.07]
use_shadows = true
shadow_map_size = 1024
shadow_ortho_size = 8.0
shadow_constant_bias = 0.001
shadow_slope_bias = 0.01
use_pcf = true
pcf_kernel_size = 1
use_aces = true
cull_mode = "none"
wireframe = false
use_mipmap = true

[camera]
projection = "perspective"
position = [2.4, 1.8, 3.2]
target = [0.0, 0.0, 0.0]
up = [0.0, 1.0, 0.0]
fov = 45.0
near = 0.1
far = 100.0

[ground]
enabled = false

[[lights]]
type = "directional"
direction = [-0.6, -1.0, -0.4]
color = [1.0, 0.93, 0.82]
intensity = 4.0

[[objects]]
path = "assets/glbs/ccity_building_set_1.glb"
normalization = "normalize"
position = [0.0, 0.0, 0.0]
rotation = [0.0, -30.0, 0.0]
scale = [3.0, 3.0, 3.0]