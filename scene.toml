# ==========================================
# Rasterizer Configuration File
# ==========================================

[render]
# --- Output & Quality ---
width = 1280
height = 720
output = "outputs/output_gltf.png"
supersample_scale = 2 # SSAA scale: 2 renders a 2x2 sample grid per output pixel
exposure = 1.0        # Tone mapping exposure

# --- Lighting & Environment ---
ambient_light = [0.1, 0.1, 0.15]

# Background modes (Choose one set)
# 1. Gradient Background (Current Default)
background_gradient_top = [0.1, 0.1, 0.15]
background_gradient_bottom = [0.02, 0.02, 0.05]
# 2. Solid Color
# background_color = [0.1, 0.1, 0.1]
# 3. Image Background
# background_image = "assets/skybox_hdri.jpg"

# --- Shadow Mapping ---
use_shadows = true
shadow_map_size = 1024
shadow_ortho_size = 10.0  # Size of the orthographic projection for directional light shadows
shadow_bias = 0.01        # Bias to prevent shadow apnea
use_pcf = true            # Percentage Closer Filtering for soft shadows
pcf_kernel_size = 1       # Radius of PCF sampling (1 = 3x3 kernel, 2 = 5x5)

# --- Post Processing ---
use_aces = true           # ACES Filmic Tone Mapping

# --- Pipeline Settings ---
cull_mode = "none"        # Options: "back", "front", "none"
use_mipmap = false         # Generate and use mipmaps for textures
# wireframe = true        # Draw wireframe on top of mesh (Debug)

[camera]
# Projection type: "perspective" or "orthographic"
projection = "perspective"
position = [2.0, 1.5, 3.0]
target = [0.0, 0.5, 0.0]
up = [0.0, 1.0, 0.0]

# Perspective settings
fov = 45.0

# Orthographic settings (Only used if projection = "orthographic")
# ortho_height = 10.0

# Clipping planes
near = 0.1
far = 100.0

# Control settings (For GUI/Input)
speed = 5.0
sensitivity = 0.005
zoom_speed = 0.02

[ground]
enabled = true
size = 10.0
# Ground material override
albedo = [0.3, 0.3, 0.35]
metallic = 0.1
roughness = 0.8

# --- Lights ---
# Supported types: "directional", "point"

[[lights]]
type = "directional"
direction = [-0.5, -1.0, -0.5]
color = [1.0, 0.9, 0.8]
intensity = 4.0
# position = [0.0, 0.0, 0.0] # Ignored for directional

[[lights]]
type = "point"
position = [2.0, 3.0, 2.0]
color = [0.2, 0.4, 0.8]
intensity = 5.0
# attenuation = [1.0, 0.09, 0.032] # Constant, Linear, Quadratic factors (Optional override)

# --- Objects ---
# Supports .gltf and .glb files

[[objects]]
path = "assets/glbs/old_rusty_car.glb"
normalization = "normalize" # "preserve", "center", or "normalize" (default)
# Right-handed transform convention: scale in local axes, then rotate Z, Y, X,
# then translate in world space. Rotation entries are [x, y, z] degrees.
position = [0.0, -0.4, 0.0]
rotation = [0.0, -45.0, 0.0]
scale = [2.0, 2.0, 2.0] # Non-uniform local-axis scale

# Example of adding a second object:
# [[objects]]
# path = "assets/glbs/another_model.glb"
# normalization = "preserve"
# position = [2.0, 0.0, 0.0]
# rotation = [0.0, 0.0, 0.0]
# scale = [1.0, 1.0, 1.0]
