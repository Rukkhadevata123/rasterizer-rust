[package]
name = "rasterizer-rust"
version = "4.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Rukkhadevata123 <rukkhadevata@foxmail.com>"]
description = "A high-performance, multi-threaded software rasterizer in Rust implementing PBR, shadow mapping, and an interactive GUI."
license = "MIT"
repository = "https://github.com/Rukkhadevata123/rasterizer-rust"
keywords = ["graphics", "rasterizer", "rendering", "software-renderer", "pbr"]
categories = ["graphics", "rendering", "game-development", "visualization", "image-processing"]
include = [
    "/assets/licenses/**",
    "/benchmarks/fixtures/transparent-triangle.gltf",
    "/docs/images/**",
    "/examples/**",
    "/src/**",
    "/tests/**",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/benchmarks/fixtures/package-scene.toml",
]

[dependencies]
nalgebra = "0.34"
env_logger = "0.11"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
gltf = { version = "1", default-features = false, features = ["import", "names", "utils"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
clap = { version = "4.5", features = ["derive"] }
minifb = "0.28"
thiserror = "2"
mikktspace = { version = "0.3", default-features = false, features = ["glam"] }

[[bin]]
name = "rasterizer"
path = "src/main.rs"
